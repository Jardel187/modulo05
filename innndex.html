<head>

    <title>Document</title>

        div.filho {
            background-color: lightcoral;

            flex: 1 1 auto;
        }

<body>
    <div class="pai">
        <div class="filho">A</div>
        <div class="filho">B</div>
        <div class="filho">C</div>
    
    </div>
